name: Run OCI Instance Creator

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '*/30 * * * *' # Läuft alle 30 Minuten automatisch
  workflow_dispatch: # Aktiviert den manuellen Start-Button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Create Private Key File
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > oci_private_key.pem
          chmod 600 oci_private_key.pem

      - name: Run Bot
        env:
          USER: ${{ secrets.OCI_USER_ID }}
          TENANCY: ${{ secrets.OCI_TENANCY_ID }}
          SUBNET: ${{ secrets.OCI_SUBNET_ID }}
          REGION: ${{ secrets.OCI_REGION }}
          FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          KEY_PATH: ./oci_private_key.pem
          SHAPE: ${{ secrets.INSTANCE_SHAPE }}
          CPUS: ${{ secrets.INSTANCE_OCPUS }}
          MEMORY: ${{ secrets.INSTANCE_MEMORY_IN_GBS }}
        run: |
          go run main.go
