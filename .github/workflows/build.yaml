name: Run OCI Instance Creator

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '*/30 * * * *' # Läuft alle 30 Minuten automatisch im Hintergrund
  workflow_dispatch: # Aktiviert den manuellen Start-Button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Create Private Key File
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > oci.key
          chmod 600 oci.key

      - name: Run Bot
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_ID }} # <-- DIESE ZEILE HINZUFÜGEN
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_PATH: ./oci.key
          INSTANCE_SHAPE: ${{ secrets.INSTANCE_SHAPE }}
          INSTANCE_OCPUS: ${{ secrets.INSTANCE_OCPUS }}
          INSTANCE_MEMORY_IN_GBS: ${{ secrets.INSTANCE_MEMORY_IN_GBS }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          go run .
