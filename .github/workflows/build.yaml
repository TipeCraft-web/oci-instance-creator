name: Run OCI Instance Creator

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '*/30 * * * *' # Läuft vollautomatisch alle 30 Minuten im Hintergrund
  workflow_dispatch: # Aktiviert den manuellen Start-Button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install oci

      - name: Run Bot
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          INSTANCE_SHAPE: ${{ secrets.INSTANCE_SHAPE }}
          INSTANCE_OCPUS: ${{ secrets.INSTANCE_OCPUS }}
          INSTANCE_MEMORY_IN_GBS: ${{ secrets.INSTANCE_MEMORY_IN_GBS }}
        run: |
          python main.py || python run.py
